name: App & Daten aktualisieren

# Publishes the app and, every 30 minutes, refreshes calendar/mail (encrypted) and the verse of the day.
on:
  push:
    branches: [main, claude/daily-overview-agent-cmt1vi]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: App-Dateien bereitstellen
        run: |
          mkdir _site
          cp -r index.html style.css app.js assistant.js verses.mjs sw.js manifest.webmanifest icons vendor _site/
      - name: Kalender, Mail & Bibelvers abrufen
        env:
          TZ: ${{ vars.TIMEZONE || 'Europe/Berlin' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          DATA_KEY: ${{ secrets.DATA_KEY }}
          ICS_URLS: ${{ secrets.ICS_URLS }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
        run: node scripts/sync.mjs _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
